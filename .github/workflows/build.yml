name: build

# Cada push a main reconstruye el PDF y publica el sitio en GitHub Pages.
# En los pull request solo se compila (sirve de comprobación antes de aceptar
# el cambio), no se publica nada.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar el PDF del curso
        run: |
          docker run --rm -v "$PWD:/work" -w /work/tex texlive/texlive:latest \
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Montar el directorio del sitio
        run: |
          mkdir -p site
          cp -r web/. site/
          cp tex/main.pdf site/curs_fisica_quimica.pdf

      - name: Guardar el PDF como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: curs_fisica_quimica
          path: tex/main.pdf
          if-no-files-found: error

      - name: Preparar el sitio para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
